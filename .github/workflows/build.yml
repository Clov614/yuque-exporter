name: Build Yuque Exporter

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e ./agent-harness pytest pytest-cov

    - name: Run tests
      run: python -m pytest agent-harness/cli_anything/yuque/tests -q

    - name: Build EXE
      run: python build.py
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: YuqueExporter-Windows
        path: dist/YuqueExporter.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: YuqueExporter-Windows
        path: release-artifact

    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-artifact/YuqueExporter.exe
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
